<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Lounge - 활용 현황 및 통계</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #121d26;
            --card-dark: #1c252e;
            --gold: #c5a059;
            --text-white: #ffffff;
            --border-line: #2c3e50;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            margin: 0; padding: 20px;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-line);
            padding-bottom: 15px; margin-bottom: 25px;
        }

        .header h1 {
            color: var(--gold); font-size: 1.8rem; margin: 0;
            display: flex; align-items: center; gap: 10px;
        }

        .live-tag {
            background: #27ae60; color: #fff; font-size: 0.8rem;
            padding: 4px 10px; border-radius: 12px; font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .filter-section {
            display: flex; gap: 10px; margin-bottom: 25px; align-items: center; background: var(--card-dark);
            padding: 15px; border-radius: 8px; border: 1px solid var(--border-line);
        }

        select, input {
            background: #121d26; color: #fff; border: 1px solid var(--border-line);
            padding: 8px 12px; border-radius: 4px; outline: none;
        }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-dark); border: 1px solid var(--border-line);
            padding: 20px; border-radius: 8px; text-align: center;
        }

        .stat-card h3 { margin: 0; color: #888; font-size: 0.9rem; }
        .stat-card p { margin: 10px 0 0; color: var(--gold); font-size: 2rem; font-weight: bold; }

        .chart-container {
            background: var(--card-dark); border: 1px solid var(--border-line);
            padding: 20px; border-radius: 8px; margin-bottom: 25px; height: 350px;
        }

        .table-container {
            background: var(--card-dark); border: 1px solid var(--border-line);
            border-radius: 8px; overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-line); font-size: 0.95rem; }
        th { background: #151d24; color: var(--gold); }
        tr:hover { background: rgba(255,255,255,0.02); }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-chart-line"></i> VIP Lounge 이용 현황 <span class="live-tag">REALTIME</span></h1>
    </div>

    <div class="filter-section">
        <label><i class="far fa-calendar-alt"></i> 조회 월 선택:</label>
        <input type="month" id="search-month" onchange="setupRealtimeListener()">
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>총 주문 건수</h3>
            <p id="total-orders">0건</p>
        </div>
        <div class="stat-card">
            <h3>T1 주문 건수</h3>
            <p id="t1-orders">0건</p>
        </div>
        <div class="stat-card">
            <h3>T2 주문 건수</h3>
            <p id="t2-orders">0건</p>
        </div>
        <div class="stat-card">
            <h3>총 음료 잔 수</h3>
            <p id="total-cups">0잔</p>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="menuChart"></canvas>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>일시</th>
                    <th>터미널</th>
                    <th>룸</th>
                    <th>주문 메뉴 상세</th>
                    <th>총 수량</th>
                </tr>
            </thead>
            <tbody id="data-table-body">
                <tr><td colspan="5" style="text-align:center; color:#777;">데이터를 불러오는 중입니다...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/9.1.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyApkN572GJrTpHt19yrVafEKqf3ZprTE64",
            databaseURL: "https://iiacprotocol-a9b4f-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let chartInstance = null;
        let currentListener = null;

        // 초기 연월 설정 (YYYY-MM)
        const now = new Date();
        const defaultYM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        document.getElementById('search-month').value = defaultYM;

        window.setupRealtimeListener = () => {
            const ym = document.getElementById('search-month').value;
            if(!ym) return;

            const targetRef = ref(db, `vip_orders/${ym}`);

            // 실시간 리스너 연결 (조회 버튼 없이 자동 업데이트)
            onValue(targetRef, (snapshot) => {
                const data = snapshot.val() || {};
                processAndRenderData(data);
            });
        };

        function processAndRenderData(data) {
            let totalOrders = 0;
            let t1Orders = 0;
            let t2Orders = 0;
            let totalCups = 0;
            const menuCounts = {};
            const allList = [];

            // T1 / T2 데이터 집계 (hidden 상태 포함 전체 파악)
            ['terminal1', 'terminal2'].forEach(term => {
                if (data[term]) {
                    Object.entries(data[term]).forEach(([id, order]) => {
                        totalOrders++;
                        if (term === 'terminal1') t1Orders++;
                        if (term === 'terminal2') t2Orders++;

                        let orderCupCount = 0;
                        let menuSummary = [];

                        if (order.orderDetails && Array.isArray(order.orderDetails)) {
                            order.orderDetails.forEach(item => {
                                const qty = parseInt(item.quantity) || 0;
                                totalCups += qty;
                                orderCupCount += qty;

                                menuCounts[item.menu] = (menuCounts[item.menu] || 0) + qty;
                                menuSummary.push(`${item.menu} (${qty}잔)`);
                            });
                        }

                        allList.push({
                            timestamp: order.timestamp || 0,
                            terminal: term === 'terminal1' ? 'T1' : 'T2',
                            room: order.room || '-',
                            summary: menuSummary.join(', '),
                            totalCup: orderCupCount
                        });
                    });
                }
            });

            // 카드 영역 갱신
            document.getElementById('total-orders').innerText = `${totalOrders}건`;
            document.getElementById('t1-orders').innerText = `${t1Orders}건`;
            document.getElementById('t2-orders').innerText = `${t2Orders}건`;
            document.getElementById('total-cups').innerText = `${totalCups}잔`;

            // 표 갱신
            const tbody = document.getElementById('data-table-body');
            if (allList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#777;">해당 월의 주문 데이터가 없습니다.</td></tr>';
            } else {
                allList.sort((a, b) => b.timestamp - a.timestamp);
                tbody.innerHTML = allList.map(item => `
                    <tr>
                        <td>${new Date(item.timestamp).toLocaleString()}</td>
                        <td><span style="color:var(--gold); font-weight:bold;">${item.terminal}</span></td>
                        <td>${item.room}</td>
                        <td>${item.summary}</td>
                        <td><b>${item.totalCup}</b>잔</td>
                    </tr>
                `).join('');
            }

            // 차트 갱신
            renderChart(menuCounts);
        }

        function renderChart(menuCounts) {
            const ctx = document.getElementById('menuChart').getContext('2d');
            const labels = Object.keys(menuCounts);
            const dataValues = Object.values(menuCounts);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '메뉴별 주문 잔 수',
                        data: dataValues,
                        backgroundColor: '#c5a059',
                        borderColor: '#b08b46',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#ffffff' } }
                    },
                    scales: {
                        x: { ticks: { color: '#ffffff' }, grid: { color: '#2c3e50' } },
                        y: { ticks: { color: '#ffffff' }, grid: { color: '#2c3e50' }, beginAtZero: true }
                    }
                }
            });
        }

        // 페이지 진입 시 자동 실시간 감시 시작
        setupRealtimeListener();
    </script>
</body>
</html>
