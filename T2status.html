<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2 ORDER STATUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121d26;
            --card-dark: #1c252e;
            --gold: #c5a059;
            --text-white: #ffffff;
            --border-line: #2c3e50;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh;
            overflow: hidden;
        }

        .header {
            padding: 25px 40px;
            border-bottom: 1px solid var(--border-line);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .header h1 {
            color: var(--gold);
            font-size: 2rem;
            margin: 0;
            font-weight: 700;
            display: flex; align-items: center;
            text-transform: uppercase;
        }

        .header h1 i { margin-right: 15px; }

        .update-timer {
            color: var(--gold);
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.9;
        }
        .update-timer strong { 
            margin-left: 8px; 
            font-family: 'Courier New', monospace; 
            font-size: 1.3rem; 
        }

        .content { flex: 1; padding: 30px; overflow-y: auto; }
        
        .order-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .order-card {
            background: var(--card-dark);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); }
        }

        .order-card.new { 
            border: 2px solid var(--gold); 
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.2); 
        }

        .room-badge {
            background: var(--gold); 
            color: #000;
            padding: 4px 12px; 
            border-radius: 4px;
            font-weight: 700; 
            font-size: 1.1rem;
            margin-bottom: 15px; 
            display: inline-block;
        }

        .order-time { 
            float: right; 
            color: #888; 
            font-size: 0.9rem; 
        }

        .item-row {
            display: flex; 
            justify-content: space-between;
            padding: 10px 0; 
            border-bottom: 1px solid #2d3436;
        }

        .footer {
            padding: 20px;
            display: flex; 
            justify-content: center;
            background: rgba(18, 29, 38, 0.95);
            border-top: 1px solid var(--border-line);
        }

        .btn-all-complete {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 12px 60px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-all-complete:hover { 
            background: var(--gold); 
            color: #000; 
        }

        .card-actions {
            margin-top: 20px;
        }

        .btn-single-complete {
            width: 100%; 
            background: #252f39; 
            border: 1px solid #444;
            color: #ddd; 
            padding: 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        
        .btn-single-complete:hover { 
            border-color: var(--gold); 
            background: var(--gold);
            color: #000; 
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-clipboard-list"></i> T2 ORDER STATUS</h1>
        <div class="update-timer">
            최근 업데이트 <strong id="current-clock">00:00:00</strong>
        </div>
    </div>

    <div class="content">
        <div id="order-container" class="order-grid"></div>
    </div>

    <div class="footer">
        <button class="btn-all-complete" onclick="clearAllOrders()">전체 주문 완료</button>
    </div>

    <audio id="alarm" src="bell.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js';
        import { getDatabase, ref, onValue, update } from 'https://www.gstatic.com/firebasejs/9.1.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyApkN572GJrTpHt19yrVafEKqf3ZprTE64",
            databaseURL: "https://iiacprotocol-a9b4f-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // T2 전용 경로 설정
        const TERMINAL_PATH = 'terminal2';
        let processedIds = new Set(); 
        let pendingOrdersMap = {};

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-clock').innerText = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 실시간 주문 수신 및 화면 렌더링
        onValue(ref(db, 'vip_orders'), (snap) => {
            const allData = snap.val() || {};
            const container = document.getElementById('order-container');
            
            pendingOrdersMap = {};
            let pendingList = [];

            // 구조 자동 탐색 (월별 경로 및 상위 경로 모두 지원)
            Object.entries(allData).forEach(([key, val]) => {
                if (key.includes('-') && val[TERMINAL_PATH]) {
                    Object.entries(val[TERMINAL_PATH]).forEach(([orderId, order]) => {
                        if (order.status !== 'completed' && order.status !== 'hidden') {
                            const fullPath = `vip_orders/${key}/${TERMINAL_PATH}/${orderId}`;
                            pendingOrdersMap[orderId] = { ...order, fullPath, id: orderId };
                            pendingList.push(pendingOrdersMap[orderId]);
                        }
                    });
                } 
                else if (key === TERMINAL_PATH) {
                    Object.entries(val).forEach(([orderId, order]) => {
                        if (order.status !== 'completed' && order.status !== 'hidden') {
                            const fullPath = `vip_orders/${TERMINAL_PATH}/${orderId}`;
                            pendingOrdersMap[orderId] = { ...order, fullPath, id: orderId };
                            pendingList.push(pendingOrdersMap[orderId]);
                        }
                    });
                }
            });

            if (pendingList.length === 0) { 
                container.innerHTML = '<div style="color:#555; text-align:center; grid-column: 1/-1; margin-top:50px;">현재 대기 중인 주문이 없습니다.</div>'; 
                return; 
            }

            let playSnd = false;
            let htmlBuffer = '';
            
            pendingList.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            pendingList.forEach((order) => {
                const id = order.id;

                if (order.isNew && !processedIds.has(id)) {
                    playSnd = true;
                    processedIds.add(id);
                    setTimeout(() => update(ref(db, order.fullPath), { isNew: false }), 1000);
                }

                let detailsHtml = '';
                if (order.orderDetails && Array.isArray(order.orderDetails)) {
                    detailsHtml = order.orderDetails.map(i => `
                        <div class="item-row">
                            <span>${i.menu || ''}</span>
                            <strong>${i.quantity || 1}잔</strong>
                        </div>
                    `).join('');
                }

                const timeStr = order.timestamp 
                    ? new Date(order.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                    : '';

                htmlBuffer += `
                    <div class="order-card ${order.isNew ? 'new' : ''}">
                        <span class="room-badge">${order.room || '룸 미지정'}</span>
                        <span class="order-time">${timeStr}</span>
                        <div style="margin-top:10px;">
                            ${detailsHtml}
                        </div>
                        <div class="card-actions">
                            <button class="btn-single-complete" onclick="finishOrder('${id}')">주문 완료</button>
                        </div>
                    </div>`;
            });

            container.innerHTML = htmlBuffer;

            if (playSnd) {
                const alarm = document.getElementById('alarm');
                alarm.currentTime = 0;
                alarm.play().catch(e => console.log("사운드 재생을 위해 화면을 클릭해주세요."));
            }
        });

        // 단일 주문 완료
        window.finishOrder = (id) => {
            const targetOrder = pendingOrdersMap[id];
            if (targetOrder) {
                update(ref(db, targetOrder.fullPath), {
                    status: 'completed',
                    completedAt: Date.now()
                });
            }
        };

        // 전체 주문 완료
        window.clearAllOrders = () => {
            const pendingIds = Object.keys(pendingOrdersMap);
            if (pendingIds.length === 0) {
                alert("처리할 대기 주문이 없습니다.");
                return;
            }

            if (confirm("현재 표시된 모든 주문을 완료 처리하시겠습니까?")) {
                const updates = {};
                pendingIds.forEach(id => {
                    const fullPath = pendingOrdersMap[id].fullPath;
                    updates[`${fullPath}/status`] = 'completed';
                    updates[`${fullPath}/completedAt`] = Date.now();
                });
                
                update(ref(db), updates).then(() => {
                    processedIds.clear();
                });
            }
        };
    </script>
</body>
</html>
